# 기획전 start_date/end_date 는 기본적으로 "봇이 홈페이지 배너에서 처음/마지막으로
# 발견한 날짜"로 자동 기록됩니다. 봇이 하루 쉬어서 실제 시작일을 놓쳤거나,
# 공식 시작일을 알고 있어서 보정하고 싶을 때 여기에 채워 넣으세요.
# 이미 자동 감지된 기획전이면 여기 값으로 덮어쓰고, 감지되지 않은(예: 앱 전용) 기획전은
# start_date 가 있으면 새로 생성됩니다. promo_name 은 배너 제목 텍스트와 정확히 일치해야 합니다.
#
# 예시:
# 슈퍼브랜드위크:
#   start_date: "2026-07-20"
#   end_date: "2026-08-03"
