# 기획전 start_date/end_date 는 기본적으로 홈페이지 API(main-vue-data)에 CMS가 등록해둔
# 정확한 게시 시작/종료일(dispStartYmd/dispEndYmd)을 그대로 사용합니다.
# 아래는 그 값을 보정하거나, 자동 스캔에 잡히지 않는(예: 게시 기간이 없거나 앱 전용인)
# 기획전을 수동으로 추가할 때만 사용하세요. promo_name 은 자동 수집된 기획전명과
# 정확히 일치해야 기존 항목에 덮어써지고, 일치하지 않으면 새 항목으로 추가됩니다
# (이 경우 start_date 가 없으면 무시됩니다).
#
# 예시:
# ライジングブランドウィーク:
#   start_date: "2026-07-20"
#   end_date: "2026-08-03"
