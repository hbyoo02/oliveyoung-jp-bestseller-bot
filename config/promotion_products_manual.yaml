# 기획전 대상 상품은 기본적으로 자동으로 수집됩니다:
#   랜딩 페이지의 상품 링크 -> 브랜드 ID 확인 -> 그 브랜드의 전체 상품 목록 조회
# 이 방식은 랜딩 페이지에 상품 링크(prdtNo)가 있는 캠페인에서만 동작합니다. 앱 전용
# 프로모션이나 텍스트/이미지 위주 캠페인처럼 상품 링크가 아예 없는 경우엔 자동 수집이
# 0건이 되는데, 이럴 때만 여기에 수동으로 채워 넣으면 자동 결과와 합쳐집니다.
#
# 예시:
# 슈퍼브랜드위크:
#   - brand: "바이오던스"
#     product_name: "콜라겐 히알루론산 앰플 마스크"
#   - brand: "바이오던스"
#     product_name: "레드 블레미쉬 크림"
