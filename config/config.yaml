# 올리브영 JP(global.oliveyoung.com, accParam=110 = 일본 로케일) 모니터링 봇 설정
#
# 이 사이트는 상품/배너 데이터를 서버가 HTML에 바로 넣지 않고, 프론트엔드가 JSON API를
# 호출해서 그려준다. 그래서 HTML 셀렉터 대신 아래 API를 직접 호출하는 방식으로 만들었다.
#   - 베스트셀러: display/product/best-seller/order-best (요청 즉시 순위 100개 JSON 반환)
#   - 홈 캐러셀:   main-vue-data (배너마다 dispStartYmd/dispEndYmd = 정확한 게시 시작/종료일 포함)

crawl:
  base_url: "https://global.oliveyoung.com"
  api:
    bestseller_path: "/display/product/best-seller/order-best"
    main_vue_data_path: "/main-vue-data"
  # 이 파라미터들이 로케일(일본/JPY)을 결정한다. accParam=110 으로 브라우저에서 확인함.
  locale_params:
    langCode: "jp"
    dlvCntryCode: "110"
    mrgnCntryCode: "110"
    acesCntryCode: "00"
  max_rank: 100
  request_timeout_sec: 15
  max_retries: 3
  retry_backoff_sec: 2

  # main-vue-data 의 cornerList 는 홈페이지의 모든 섹션(캐러셀, 브랜드 모음, K-Pop 등)을
  # 포함한다. 특정 corner 번호만 보고 싶으면 여기 채운다 (예: ["PC000020"]).
  # 비워두면 전체 corner를 스캔하고 게시 기간 길이로 기획전 여부를 판단한다.
  promotion_corner_numbers: []

thresholds:
  always_bestseller:
    lookback_days: 14      # 최근 며칠을 볼지
    min_days_in_top: 10    # 그 중 며칠 이상 top_rank 이내여야 하는지
    top_rank: 10

  promotion_detection:
    # 게시 기간이 이보다 길면 상시성 배너(예: 월간 웰컴 혜택)로 보고 기획전에서 제외한다.
    # 실제 배너들을 보면서 조정이 필요할 수 있다.
    max_duration_days: 14

  promotion_impact:
    min_elapsed_days: 1        # 기획전 시작 후 최소 경과일 (당일/익일 데이터는 판단 제외)
    already_top_before_rank: 20   # "기획전 전에도 20위 이내"
    surge_to_rank: 5               # "기획전 후 5위 이내로 상승"
    midrange_before_max_rank: 100  # "기획전 전 100위 이내"
    midrange_min_jump: 50          # "50위 이상 급상승"
    new_entry_after_max_rank: 50   # "기획전 전 100위 밖 -> 후 상위권" 판단 기준 (상위권 = 이 순위 이내)

  seasonal_trend:
    top_n: 30           # 상위 몇 위 이내를 볼지
    min_count: 3         # 동일 태그 상품이 몇 개 이상 동시 랭크되면 트렌드로 판단할지

  notable_entry:
    top_n: 30            # 이 순위 이내 신규 진입만 "특이 신규 진입"으로 취급

# 상품명/브랜드명에 포함된 키워드로 계절·상황 속성을 태깅하는 규칙.
# 사이트가 일본어이므로 한국어/일본어/영어 키워드를 함께 등록해두고,
# 실제 상품명을 보면서 계속 보완해야 합니다.
tags:
  워터프루프:
    - 워터프루프
    - waterproof
    - ウォータープルーフ
  쿨링:
    - 쿨링
    - cooling
    - クール
    - 冷感
  피지_모공:
    - 피지
    - 모공
    - 皮脂
    - 毛穴
  보습:
    - 보습
    - 수분
    - 保湿
  선케어:
    - 선크림
    - 자외선
    - UV
    - 日焼け止め
