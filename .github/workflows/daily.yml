name: Daily Bestseller Monitor

on:
  schedule:
    # 매일 01:00 UTC = 10:00 KST
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Commit updated data & site
        run: |
          git config user.name "oy-bot"
          git config user.email "oy-bot@users.noreply.github.com"
          git add data/ docs/latest.json
          git diff --cached --quiet || git commit -m "chore: daily bestseller data $(date -u +%Y-%m-%d)"
          git push
